<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>STARLINGUA</title>
<style>
:root{--bg:#faf7ff;--card:#fff;--tx:#2a1a4a;--pu:#7c3aed;--ye:#fbbf24;--ce:#38bdf8;--go:#f5b800;--or:#fb923c;--ok:#16a34a;--bad:#ea580c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#150d28;--card:#241a40;--tx:#f5efff}}
:root[data-theme=dark]{--bg:#150d28;--card:#241a40;--tx:#f5efff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif;font-size:1rem}
main{max-width:860px;margin:0 auto;padding:14px 14px 100px}
h1,h2{margin:.3em 0;color:var(--pu)}h1{text-align:center;font-size:2rem}
.card{background:var(--card);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #7c3aed22}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;font-weight:700;border:3px solid transparent;border-radius:16px;padding:14px;background:var(--pu);color:#fff;cursor:pointer;min-height:48px}
button:focus-visible{outline:4px solid var(--or)}button.y{background:var(--ye);color:#2a1a4a}button.c{background:var(--ce);color:#10243a}button.o{background:var(--or);color:#2a1a4a}button.g{background:transparent;color:var(--pu);border-color:var(--pu)}
button.opt{background:var(--card);color:var(--tx);border-color:var(--ce);text-align:left}button.ok{background:#bbf7d0;color:#14532d;border-color:var(--ok)}button.no{background:#fed7aa;color:#7c2d12;border-color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;overflow-x:auto;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -3px 12px #7c3aed33}
nav button{flex:0 0 auto;padding:8px 10px;font-size:.8rem;min-height:44px;background:transparent;color:var(--tx)}nav button.on{background:var(--ye);color:#2a1a4a}
.bub{background:#ede9fe;color:#2a1a4a;border-radius:18px;padding:10px 14px;font-weight:700}.row{display:flex;align-items:center;gap:10px}
.bar{height:16px;background:#e5def5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--go))}
.big{font-size:2.6rem;text-align:center}.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:700;color:#fff;margin:2px}
.S{background:#2563eb}.V{background:#dc2626}.C{background:#16a34a}.A{background:#7c3aed}
.fl{animation:fl 3s ease-in-out infinite}.sp{animation:sp 1.6s infinite}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes sp{50%{opacity:.2}}
.noanim *{animation:none!important}.chip{font-size:1.4rem;padding:6px}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
/* ---------- Storage layer (swap for Firebase/Supabase later) ---------- */
const Store={get(){try{return JSON.parse(localStorage.getItem("stl")||"{}")}catch(e){return{}}},put(s){try{localStorage.setItem("stl",JSON.stringify(s))}catch(e){}}};
let S=Object.assign({stars:0,lv:"A1",hist:[],done:{},words:[],badges:[],set:{snd:1,anim:1,dark:0,size:18}},Store.get());
const save=()=>Store.put(S);
/* ---------- Content (JSON-like: add levels/words/stories here or load from /data/*.json) ---------- */
const LV={A1:["Beginner","#22c55e"],A2:["Elementary","#38bdf8"],B1:["Intermediate","#fbbf24"],B2:["Upper Intermediate","#fb923c"],C1:["Advanced","#7c3aed"],C2:["Proficiency","#ef4444"]};
const VOC={A1:[["sun","sol","☀️"],["school","escuela","🏫"],["family","familia","👨‍👩‍👧"],["mountain","montaña","🏔️"],["potato","papa","🥔"],["corn","maíz","🌽"],["beautiful","hermoso","🌄"]],
A2:[["market","mercado","🧺"],["bus","bus","🚌"],["lake","lago","🌊"],["cheese","queso","🧀"]],B1:[["journey","viaje","🧳"],["harvest","cosecha","🌾"],["university","universidad","🎓"]],
B2:[["commute","trayecto diario","🚠"],["landscape","paisaje","🏞️"],["heritage","patrimonio","🏛️"]],C1:[["resilience","resiliencia","💪"],["sustainable","sostenible","♻️"]],C2:[["stoicism","estoicismo","🧘"],["nuance","matiz","🎨"]]};
const DICT={sun:["noun","/sʌn/","The sun is bright.","El sol es brillante.","suns","sunny, sunlight","Nature"],school:["noun","/skuːl/","She studies at school.","Ella estudia en la escuela.","schools","student, teacher","Places"],family:["noun","/ˈfæməli/","My family lives in El Alto.","Mi familia vive en El Alto.","families","mother, father","Family"],mountain:["noun","/ˈmaʊntən/","The mountain is very high.","La montaña es muy alta.","mountains","hill, peak","Nature"],beautiful:["adjective","/ˈbjuːtɪfəl/","La Paz is beautiful.","La Paz es hermosa.","—","pretty, lovely","Feelings"]};
const LISTEN={A1:[["The student goes to school.","The student goes to the park.","The student goes to the market."],["Maria lives in La Paz.","Maria lives in El Alto.","Maria lives in Oruro."]],A2:[["Yesterday we went to the market.","Tomorrow we will go to the market.","Yesterday we went to the lake."]],B1:[["If it rains, we will stay at home.","If it rained, we would stay at home.","If it rains, we stayed at home."]],B2:[["The bridge was built in 2014.","The bridge has built in 2014.","The bridge was built in 2040."]],C1:[["Not only did she finish, but she also presented.","Not only she finished, but she also presented.","Not only did she finish, but she also left."]],C2:[["Seldom have we seen such resilience.","Seldom we have seen such resilience.","Seldom have we seen such silence."]]};
const FILL={A1:[["She ___ to school every day.",["go","goes","going","to go"],1],["They ___ quinoa every day.",["eat","eats","eating","to eating"],0],["I ___ a student.",["am","is","are","be"],0]],A2:[["Yesterday, I ___ to the market.",["go","went","goes","going"],1],["She is ___ than her brother.",["tall","taller","tallest","more tall"],1]],B1:[["I have ___ in La Paz for ten years.",["live","lived","living","lives"],1],["If it rains, we ___ at home.",["stay","will stay","stayed","would stay"],1]],B2:[["If I had more time, I ___ learn Aymara.",["will","would","can","am going to"],1],["The bridge ___ built in 2014.",["is","was","has","were"],1]],C1:[["Not only ___ she finish the report, but she also presented it.",["did","does","has","was"],0],["Had I known, I ___ have come earlier.",["would","will","can","do"],0]],C2:[["Seldom ___ we seen such resilience.",["have","are","do","were"],0],["She insisted that he ___ on time.",["be","is","was","being"],0]]};
const BUILD={A1:[[["I","go","to","school","every day"],"Voy a la escuela todos los días"],[["Maria","walks","to","school","every morning"],"María camina a la escuela cada mañana"]],A2:[[["We","will","travel","to","Copacabana","tomorrow"],"Viajaremos a Copacabana mañana"]],B1:[[["She","has","studied","English","for","two","years"],"Ella estudia inglés hace dos años"]],B2:[[["If","I","had","time,","I","would","travel","more"],"Si tuviera tiempo, viajaría más"]],C1:[[["Having","finished","work,","she","went","home"],"Habiendo terminado el trabajo, se fue a casa"]],C2:[[["Seldom","have","we","seen","such","resilience"],"Rara vez hemos visto tal resiliencia"]]};
const SUBJ=[["My dog is beautiful.",["My dog","is","beautiful","My"],0],["The student goes to school.",["The student","goes","school","to"],0],["Maria lives in La Paz.",["lives","Maria","La Paz","in"],1]];
const STORY={A1:{t:"Maria in La Paz",e:"🏙️",p:["Maria lives in La Paz.","She studies at school.","Every morning, she walks to school."],q:[["Where does Maria live?",["In La Paz","In El Alto","In Sucre"],0]],g:"Present simple: lives, studies, walks"},
A2:{t:"Market Day",e:"🧺",p:["Last Saturday, Carlos went to the market in El Alto.","He bought potatoes, corn and quinoa.","Then he took a minibus home with his mother."],q:[["What did Carlos buy?",["Potatoes, corn and quinoa","Bread and milk","Fruit and fish"],0]],g:"Past simple: went, bought, took"},
B1:{t:"A Student at UPEA",e:"🎓",p:["Ana studies at UPEA University and travels by bus every morning.","She has been learning English for two years.","If she practices every day, she will improve quickly."],q:[["How does Ana travel?",["By bus","By train","On foot"],0]],g:"Present perfect continuous; first conditional"},
B2:{t:"The Cable Car",e:"🚠",p:["The cable car system, which was built to reduce traffic, connects La Paz with El Alto.","Thousands of people use it every day.","Without it, commuting would still be much slower."],q:[["Why was it built?",["To reduce traffic","Only for tourists","To carry goods"],0]],g:"Passive voice; relative clause; conditional"},
C1:{t:"Language and Identity",e:"🗣️",p:["Having grown up speaking Aymara at home, Rosa regards English as an additional tool rather than a replacement for her identity.","Not only does it open professional doors, but it also lets her share her culture globally."],q:[["How does Rosa see English?",["As an additional tool","As a replacement","As unnecessary"],0]],g:"Participle clause; inversion"},
C2:{t:"The Weight of Words",e:"🏔️",p:["Seldom does a landscape shape a people so thoroughly as the Altiplano has shaped those who farm its thin, cold soil.","Their resilience, far from being mere stoicism, reflects a considered adaptation to scarcity."],q:[["What does the writer say about their resilience?",["It is a considered adaptation","It is simple stoicism","It is a recent habit"],0]],g:"Negative inversion; concessive apposition"}};
const GRAM={A1:["Verb to be","I am, you are, she is. Example: She is a student."],A2:["Past simple","Regular verbs add -ed (walked); some are irregular (go → went)."],B1:["First conditional","If + present simple, will + verb. If it rains, we will stay."],B2:["Second conditional","If + past simple, would + verb. If I had time, I would travel."],C1:["Inversion","Negative adverb + auxiliary + subject: Not only did she finish…"],C2:["Register & nuance","Choose structures by formality: Seldom have we seen… (formal)."]};
const BADGES=[["🌟 First Lesson",s=>tot(s)>=1],["🌟 First 1,000 Stars",s=>s.stars>=1000],["🌟 10 Words Learned",s=>s.words.length>=10],["🌟 First Story",s=>(s.done.reading||0)>=1],["🌟 First Speaking Practice",s=>(s.done.speaking||0)>=1],["🌟 10 Games Completed",s=>(s.done.games||0)>=10],["🌟 Listening Explorer",s=>(s.done.listening||0)>=5],["🌟 Reading Explorer",s=>(s.done.reading||0)>=3],["🌟 Grammar Explorer",s=>(s.done.grammar||0)>=5],["🌟 Starlingua Master",s=>s.stars>=50000]];
const tot=s=>Object.values(s.done).reduce((a,b)=>a+b,0);
const ICON={listening:"🎧",speaking:"🗣",reading:"📖",writing:"✍️",vocabulary:"📚",grammar:"📘",games:"🎮"};
/* ---------- Helpers ---------- */
const $=(s)=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say=(t)=>{if(!S.set.snd||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)};
const log=(t,n)=>{S.hist.unshift({d:new Date().toLocaleDateString("en",{month:"long",day:"numeric"}),t,n});S.hist=S.hist.slice(0,300);save()};
const win=(sk,pts=1000)=>{S.stars+=pts;S.done[sk]=(S.done[sk]||0)+1;BADGES.forEach(([n,f])=>{if(!S.badges.includes(n)&&f(S))S.badges.push(n)});save()};
const star=(m,sz=90)=>`<div class="row"><svg class="fl" width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 62,36 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,36" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="50" r="3" fill="#2a1a4a"/><circle cx="58" cy="50" r="3" fill="#2a1a4a"/><path d="M42 60q8 8 16 0" stroke="#2a1a4a" stroke-width="3" fill="none"/><line x1="76" y1="70" x2="96" y2="48" stroke="#7c3aed" stroke-width="4"/><circle class="sp" cx="97" cy="46" r="4" fill="#fb923c"/><circle class="sp" cx="12" cy="14" r="3" fill="#38bdf8"/></svg><div class="bub">${m}</div></div>`;
const lev=sim=>sim;
const norm=t=>t.toLowerCase().replace(/[^a-z ]/g,"").trim();
function dist(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const match=(h,t)=>{h=norm(h);t=norm(t);return Math.round(Math.max(0,1-dist(h,t)/Math.max(h.length,t.length,1))*100)};
const band=p=>p>=90?["🟢 Excellent","Great! Keep this sound."]:p>=70?["🟢 Very Good","Listen and repeat once more."]:p>=50?["🟡 Keep Practicing","Speak slowly."]:p>=25?["🟠 Try Again","Try the vowel sound again."]:["🔴 Let's Practice","Listen and repeat."];
const mk={
vocab:lv=>VOC[lv].map(w=>{const o=sh([w[1],...sh(VOC[lv].filter(x=>x!=w)).slice(0,3).map(x=>x[1])]);return{sk:"vocabulary",p:`${w[2]} What does "${w[0]}" mean?`,say:w[0],o,a:o.indexOf(w[1]),w:w[0]}}),
pic:lv=>VOC[lv].map(w=>{const o=sh([w[0],...sh(VOC[lv].filter(x=>x!=w)).slice(0,3).map(x=>x[0])]);return{sk:"games",p:`${w[2]} Which word matches the picture?`,say:w[0],o,a:o.indexOf(w[0]),w:w[0]}}),
listen:lv=>LISTEN[lv].map(l=>{const o=sh(l);return{sk:"listening",p:"❓ What did you hear?",say:l[0],hide:1,o,a:o.indexOf(l[0])}}),
fill:(lv,sk="grammar")=>FILL[lv].map(f=>{const o=sh(f[1]);return{sk,p:f[0],o,a:o.indexOf(f[1][f[2]])}}),
build:(lv,sk="writing")=>BUILD[lv].map(b=>({sk,b:b[0],es:b[1]})),
subj:()=>SUBJ.map(s=>{const o=sh(s[1]);return{sk:"writing",p:`Identify the SUBJECT in: "${s[0]}"`,o,a:o.indexOf(s[1][s[2]])}}),
read:lv=>STORY[lv].q.map(q=>{const o=sh(q[1]);return{sk:"reading",p:q[0],o,a:o.indexOf(q[1][q[2]])}}),
speak:lv=>VOC[lv].map(w=>({sk:"speaking",sp:w[0],e:w[2]}))};
/* ---------- State & views ---------- */
let V="home",Q=null,B=null,R=null;
const A={go(v){V=v;R=null;draw()},lv(l){S.lv=l;save();V="hub";draw()},
start(p){const[t,k]=p.split("|");const lv=S.lv;let it;
 it=k=="daily"?[mk.vocab(lv)[0],mk.fill(lv)[0],mk.listen(lv)[0],mk.read(lv)[0],(mk.build(lv)[0])].filter(Boolean):k=="listening"?mk.listen(lv):k=="vocabulary"?mk.vocab(lv):k=="grammar"?mk.fill(lv):k=="writing"?[...mk.build(lv),...(lv=="A1"?mk.subj():[])]:k=="speaking"?mk.speak(lv):k=="read"?mk.read(lv):k=="pic"?mk.pic(lv):k=="gb"?mk.build(lv,"games"):k=="gf"?mk.fill(lv,"games"):k=="gg"?mk.fill(lv,"games"):mk.vocab(lv).map(x=>({...x,sk:"games"}));
 Q={t,k,it,i:0,sc:0,sel:null,ok:null};B=null;V="quiz";draw()},
pick(i){if(Q.sel!=null)return;const it=Q.it[Q.i];Q.sel=+i;Q.ok=Q.sel==it.a;if(Q.ok){Q.sc++;win(it.sk);if(it.w&&!S.words.includes(it.w)){S.words.push(it.w);save()}}draw()},
bt(i){B.c.push(B.p.splice(+i,1)[0]);draw()},bu(){B.p.push(B.c.pop());draw()},
chk(){const it=Q.it[Q.i];Q.ok=B.c.join(" ")==it.b.join(" ");Q.sel=1;if(Q.ok){Q.sc++;win(it.sk)}draw()},
next(){Q.i++;Q.sel=null;Q.ok=null;B=null;if(Q.i>=Q.it.length){log(`${ICON[Q.it[0].sk]||"⭐"} ${Q.t}`,`Score: ${Q.sc}/${Q.it.length}`);V="done"}draw()},
say(t){say(t)},sayw(t){say(t)},
word(w){say(w)},
mic(){const t=Q.it[Q.i].sp;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){R={err:"Speech recognition is not available in this browser. Try Chrome on Android or desktop."};draw();return}
 const r=new SR();r.lang="en-US";r.maxAlternatives=3;R={listen:1};draw();
 r.onresult=e=>{let b=0;for(const a of e.results[0])b=Math.max(b,match(a.transcript,t));const h=e.results[0][0].transcript;R={p:b,h};if(b>=70){win("speaking",b>=90?1000:500)}else{S.done.speaking=S.done.speaking||0;}save();draw()};
 r.onerror=()=>{R={err:"I could not hear you. Check microphone permission and try again."};draw()};r.onend=()=>{if(R&&R.listen){R=null;draw()}};r.start()},
spn(){Q.sel=1;Q.i++;R=null;if(Q.i>=Q.it.length){log("🗣 Speaking","Practiced "+Q.it.length+" words");V="done"}draw()},
dq(q){R={q}; draw(); const i=$("#dq");if(i){i.focus();i.setSelectionRange(99,99)}},
story(l){R={s:l};draw()},sent(){const s=getSelection().toString().trim();if(s)say(s)},
set(k){if(k=="dark")S.set.dark=+!S.set.dark;else S.set[k]=+!S.set[k];save();apply();draw()},sz(d){S.set.size=Math.min(26,Math.max(15,S.set.size+ +d));save();apply();draw()},
reset(){if(confirm("Reset ALL progress? This cannot be undone.")){S={stars:0,lv:"A1",hist:[],done:{},words:[],badges:[],set:S.set};save();V="home";draw()}},
finishStory(){win("reading",1000);log("📖 Reading",STORY[S.lv].t+" completed");V="hub";draw()}};
function apply(){const r=document.documentElement;r.dataset.theme=S.set.dark?"dark":"light";r.style.fontSize=S.set.size+"px";document.body.className=S.set.anim?"":"noanim"}
const btn=(a,p,t,c="")=>`<button class="${c}" data-a="${a}" data-p="${esc(p)}">${t}</button>`;
const lvbar=()=>`<div class="row"><b style="color:${LV[S.lv][1]}">⭐ ${S.lv} – ${LV[S.lv][0]}</b></div>`;
const nav=[["home","🏠","Home"],["level","📚","Learn"],["games","🎮","Games"],["stories","📖","Stories"],["dict","🔎","Dictionary"],["stars","⭐","My Stars"],["prog","📊","Progress"],["hist","📋","History"],["set","⚙️","Settings"]];
function view(){
if(V=="home")return`<h1>⭐ STARLINGUA ⭐</h1><p class="big" style="font-size:1.1rem">Learn English with your magical star.</p>${star("Let's learn English!",130)}<div class="grid" style="margin-top:14px">${btn("go","level","🚀 LET'S START!","y")}${btn("go","level","📚 LEARN")}${btn("go","games","🎮 GAMES","c")}${btn("go","stories","📖 STORIES","o")}${btn("go","dict","🔎 DICTIONARY","c")}${btn("go","stars","⭐ MY STARS","y")}${btn("go","prog","📊 MY PROGRESS")}${btn("go","set","⚙️ SETTINGS","g")}${btn("start","Daily Star Challenge|daily","⭐ DAILY STAR CHALLENGE","o")}</div>`;
if(V=="level")return`<h2>SELECT YOUR LEVEL</h2>${Object.entries(LV).map(([k,v])=>btn("lv",k,`${k} – ${v[0]}`,"").replace('class=""',`style="background:${v[1]};color:#1a1030;width:100%;margin:5px 0;font-size:1.1rem"`)).join("")}`;
if(V=="hub")return`${lvbar()}${star("Pick an activity!",70)}<div class="grid">${btn("start","Let's practice listening|listening","🎧 LISTENING")}${btn("go","speak","🗣 SPEAKING","c")}${btn("go","stories","📖 READING","o")}${btn("start","Let's write|writing","✍️ WRITING","y")}${btn("go","vocab","📚 VOCABULARY","c")}${btn("go","gram","📘 GRAMMAR")}</div><div class="grid" style="margin-top:10px">${btn("go","games","🎮 GAMES","g")}${btn("go","stories","📖 STORIES","g")}${btn("go","dict","🔎 DICTIONARY","g")}</div><div class="row" style="margin-top:12px">${btn("go","level","← BACK","g")}${btn("go","home","🏠 HOME","g")}${btn("go","games","NEXT →","g")}</div>`;
if(V=="vocab"){const w=VOC[S.lv];return`${lvbar()}<h2>📚 VOCABULARY</h2>${w.map(x=>`<div class="card row"><span class="big chip">${x[2]}</span><div style="flex:1"><b>${x[0]}</b> — ${x[1]}<br><small>${DICT[x[0]]?DICT[x[0]][2]:""}</small></div>${btn("word",x[0],"🔊","c")}</div>`).join("")}${btn("start","Vocabulary quiz|vocabulary","⭐ Practice these words","y")}`}
if(V=="gram"){const g=GRAM[S.lv];return`${lvbar()}<h2>📘 ${g[0]}</h2><div class="card">${g[1]}</div><div class="card"><b>Color + label system</b><p><span class="tag S">My dog = SUBJECT</span><span class="tag V">is = VERB</span><span class="tag C">beautiful = ADJECTIVE / COMPLEMENT</span></p><small>Colors always come with labels.</small></div>${btn("start","Grammar practice|grammar","⭐ Practice grammar","y")}`}
if(V=="speak")return`${lvbar()}<h2>🗣 LET'S SPEAK!</h2>${star("Listen, then say the word.",70)}${btn("start","Speaking practice|speaking","🎙️ Start speaking","y")}`;
if(V=="games")return`${lvbar()}<h2>🎮 EASY GAMES</h2><div class="grid">${btn("start","Word Match|pic","🖼 Word Match")}${btn("start","Sentence Builder|gb","🧩 Sentence Builder","c")}${btn("start","Fill the Gap|gf","✏️ Fill the Gap","o")}${btn("start","Grammar Challenge|gg","📘 Grammar Challenge","y")}${btn("start","Vocabulary Quiz|gv","📚 Vocabulary Quiz")}</div>${btn("go","level","Change level","g")}`;
if(V=="stories"){const s=STORY[S.lv];if(R&&R.s)return storyView(s);return`${lvbar()}<h2>📖 LET'S READ!</h2><div class="card row"><span class="big">${s.e}</span><div style="flex:1"><b>${s.t}</b></div>${btn("story","1","Read","y")}</div><p><small>Sample story shown. Add more in the STORY data.</small></p>${btn("go","level","Change level","g")}`}
if(V=="dict"){const q=(R&&R.q)||"";return`<h2>🔎 STARLINGUA DICTIONARY</h2><div class="row"><input id="dq" value="${esc(q)}" placeholder="sun, school, escuela…" aria-label="Search" style="flex:1;font-size:1.2rem;padding:12px;border-radius:14px;border:3px solid var(--ce);background:var(--card);color:var(--tx)" oninput="A.dq(this.value)"></div>${dictRes(q)}`}
if(V=="stars")return`<h2>⭐ MY STARS</h2><div class="card big">⭐⭐⭐⭐⭐<br><b id="cnt">${S.stars.toLocaleString()}</b> STARS</div><div class="card">Level: ${S.lv} · Activities: ${tot(S)} · Words: ${S.words.length} · Stories: ${S.done.reading||0}<br>🎧 ${S.done.listening||0} · 🗣 ${S.done.speaking||0} · ✍️ ${S.done.writing||0} · 📖 ${S.done.reading||0} · 📘 ${S.done.grammar||0} · 🎮 ${S.done.games||0}</div><h2>Achievements</h2><div class="grid">${BADGES.map(b=>`<div class="card" style="opacity:${S.badges.includes(b[0])?1:.4}">${b[0]}</div>`).join("")}</div>`;
if(V=="prog"){const r=[["Listening","listening"],["Speaking","speaking"],["Reading","reading"],["Writing","writing"],["Vocabulary","vocabulary"],["Grammar","grammar"]];return`<h2>📊 MY PROGRESS</h2><small>Practice progress (not a CEFR certification)</small>${r.map(x=>{const p=Math.min(100,(S.done[x[1]]||0)*5);return`<div class="card">${ICON[x[1]]} ${x[0]} — ${p}%<div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}`}
if(V=="hist")return`<h2>📋 MY HISTORY</h2>${S.hist.length?S.hist.map(h=>`<div class="card"><b>${h.d}</b><br>${h.t}<br>${h.n}</div>`).join(""):"<div class='card'>No sessions yet. Let's start!</div>"}`;
if(V=="set"){const s=S.set;return`<h2>⚙️ SETTINGS</h2><div class="grid">${btn("set","snd",`Sound: ${s.snd?"ON":"OFF"}`,"c")}${btn("set","anim",`Animations: ${s.anim?"ON":"OFF"}`,"c")}${btn("set","dark",`Dark mode: ${s.dark?"ON":"OFF"}`,"c")}${btn("sz","2","Text size +","y")}${btn("sz","-2","Text size −","y")}${btn("reset","","Reset progress","o")}</div><p><small>Interface language (EN/ES) and music: coming next.</small></p>`}
if(V=="done")return`${star("Wonderful! ⭐ Keep Going!",110)}<div class="card big">${Q.sc}/${Q.it.length}<br>⭐ ${S.stars.toLocaleString()}</div><div class="grid">${btn("go","hub","← Back to level","g")}${btn("go","home","🏠 Home")}</div>`;
if(V=="quiz")return quizView()}
function storyView(s){return`${lvbar()}<h2>${s.e} ${s.t}</h2><div class="card" id="rd">${s.p.map(p=>`<p>${p.split(" ").map(w=>`<span data-a="word" data-p="${esc(w.replace(/[^A-Za-z']/g,""))}" style="cursor:pointer">${esc(w)}</span>`).join(" ")}</p>`).join("")}</div><div class="row">${btn("say",s.p.join(" "),"🔊 Listen to story","c")}${btn("sent","","🔊 Listen to selection","c")}</div><div class="card"><b>Grammar:</b> ${s.g}</div>${s.q.map(q=>`<div class="card"><b>${q[0]}</b><br><small>Answer: ${q[1][q[2]]}</small></div>`).join("")}<small>Tap a word to hear it.</small><br>${btn("finishStory","","✅ Done reading (+1000 ⭐)","y")}`}
function dictRes(q){q=q.trim().toLowerCase();if(!q)return"";const all=Object.values(VOC).flat(),hit=all.filter(w=>w[0].includes(q)||w[1].toLowerCase().includes(q)).slice(0,6);if(!hit.length)return"<div class='card'>No results. More words can be added to the data.</div>";
return hit.map(w=>{const d=DICT[w[0]];const lv=Object.keys(VOC).find(k=>VOC[k].includes(w));return`<div class="card"><div class="row"><span class="big">${w[2]}</span><div><h2>${w[0].toUpperCase()}</h2>Meaning: <b>${w[1]}</b></div>${btn("word",w[0],"🔊 Listen","c")}</div>Part of speech: ${d?d[0]:"—"}<br>Pronunciation: ${d?d[1]:"Pronunciation unavailable"}<br>${d?`Example: "${d[2]}"<br>Traducción: "${d[3]}"<br>Plural: ${d[4]}<br>Related: ${d[5]}<br>Topic: ${d[6]}<br>`:""}Level: ${lv}</div>`}).join("")}
function quizView(){const it=Q.it[Q.i];const head=`<div class="row"><b>${Q.t}</b><span style="margin-left:auto">${Q.i+1}/${Q.it.length} · ⭐ ${S.stars.toLocaleString()}</span></div><div class="bar"><i style="width:${Q.i/Q.it.length*100}%"></i></div>`;
if(it.sp){const m=R&&R.p!=null?band(R.p):null;return`${head}<div class="card"><div class="big">${it.e} ${it.sp}</div><div class="row">${btn("word",it.sp,"🎧 Listen","c")}${btn("mic","","🎙️ Speak","y")}</div>${R&&R.listen?"<p>🎙️ Listening…</p>":""}${R&&R.err?`<p>${R.err}</p>`:""}${m?`<p><b>Approximate pronunciation match: ${R.p}%</b> — ${m[0]}<br>I heard: "${esc(R.h)}"<br>${m[1]}<br><small>Estimate from speech recognition, not an exact score.</small></p>`:""}</div>${btn("spn","","Next →","g")}`}
if(it.b){if(!B)B={p:sh(it.b),c:[]};return`${head}<div class="card"><b>Build the sentence</b> <small>(${it.es})</small><div style="min-height:56px;font-size:1.3rem;margin:8px 0">${B.c.join(" ")||"…"}</div><div class="row" style="flex-wrap:wrap">${B.p.map((w,i)=>btn("bt",i,w,"c")).join("")}</div><div class="row" style="margin-top:8px">${btn("bu","","↩ Undo","g")}${btn("chk","","Check ✓","y")}${btn("say",it.b.join(" "),"🔊","c")}</div>${Q.sel!=null?`<p class="bub">${Q.ok?"Excellent! ⭐ +1000":"Try again! Answer: "+it.b.join(" ")}</p>${btn("next","","Next →","")}`:""}</div>`}
return`${head}<div class="card"><h2>${it.hide&&Q.sel==null?"🎧 Listen":esc(it.p)}</h2>${it.say?btn("say",it.say,"🔊 LISTEN","c"):""}<p>${it.hide?esc(it.p):""}</p>${it.o.map((o,i)=>`<div style="margin:6px 0">${btn("pick",i,String.fromCharCode(65+i)+") "+esc(o),"opt"+(Q.sel!=null?(i==it.a?" ok":i==Q.sel?" no":""):"")).replace('<button class','<button style="width:100%" class')}</div>`).join("")}${Q.sel!=null?`<p class="bub">${Q.ok?["Excellent! ⭐","Great Job! ⭐","Wonderful! ⭐","Amazing! ⭐"][Q.i%4]+" +1000":"Almost there! Keep practicing."}</p>${btn("next","","Next →")}`:""}</div>`}
function draw(){const m=$("#app");const f=document.activeElement&&document.activeElement.id=="dq";m.innerHTML=view();$("#nav").innerHTML=nav.map(n=>`<button class="${V==n[0]?"on":""}" data-a="go" data-p="${n[0]}">${n[1]}<br>${n[2]}</button>`).join("");if(f){const i=$("#dq");i.focus();i.setSelectionRange(99,99)}window.scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,p=t.dataset.p;if(a=="go"){V=p=="learn"?"level":p;R=null;draw()}else if(a=="say")say(p);else A[a](p)});
apply();draw();
</script></body></html>
